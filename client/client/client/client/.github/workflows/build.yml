name: Build Windows App
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      run: npm install
      working-directory: ./client
    - name: Build App
      run: npm run build
      working-directory: ./client
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: tiktok-app-exe
        path: client/dist/*.exe
